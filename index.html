<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SYNC – Under Maintenance</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rajdhani:wght@500;600&display=swap">
<style>
:root{--bg:#0a0618;--bg2:#1a0b3d;--cy:#3fd8ff;--pk:#ff4fd8;--vi:#9b5cff;--tx:#f1e9ff;--mu:#a99bd0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font-family:'Rajdhani',system-ui,sans-serif;font-size:1.2rem;
background-image:radial-gradient(60% 50% at 50% 30%,#3a1380 0%,transparent 70%),radial-gradient(50% 40% at 50% 100%,#1b2a7a66 0%,transparent 70%),linear-gradient(var(--bg2),var(--bg));
background-attachment:fixed}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.25rem 3rem}
.logo{width:min(560px,86vw);height:auto;filter:drop-shadow(0 0 28px #b44cff88)}
h1{font-family:'Russo One',Impact,sans-serif;font-weight:400;font-size:clamp(1.6rem,5vw,3rem);line-height:1.15;margin:.5rem 0 .75rem;letter-spacing:.03em;
background:linear-gradient(90deg,var(--cy),var(--vi) 50%,var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #9b5cff66)}
p{margin:0 auto;max-width:34ch;color:var(--mu);font-weight:500}
.pad{display:flex;gap:clamp(.5rem,2vw,1rem);margin-top:2rem}
.pad span{width:clamp(48px,12vw,68px);aspect-ratio:1;display:grid;place-items:center;border:2px solid var(--c);border-radius:10px;color:var(--c);background:#ffffff08;opacity:.45;animation:hit 2.4s infinite;animation-delay:var(--d)}
.pad svg{width:55%;height:55%;fill:currentColor}
.l{--c:var(--cy);--d:0s}.d{--c:var(--pk);--d:.6s}.u{--c:var(--vi);--d:1.2s}.r{--c:var(--pk);--d:1.8s}
@keyframes hit{0%,22%,100%{opacity:.45;box-shadow:none;transform:none}6%{opacity:1;box-shadow:0 0 22px var(--c),inset 0 0 14px var(--c);transform:scale(1.1)}}
.bars{display:flex;gap:4px;align-items:flex-end;height:36px;margin-top:2.25rem}
.bars i{width:6px;height:100%;background:linear-gradient(var(--pk),var(--cy));border-radius:2px;transform-origin:bottom;opacity:.7;animation:eq 1.2s ease-in-out infinite alternate;animation-delay:calc(var(--n)*-.17s)}
@keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.pad span,.bars i{animation:none}.bars i{transform:scaleY(.6)}}
</style></head><body><main>
